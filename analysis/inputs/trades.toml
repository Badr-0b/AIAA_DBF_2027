# Configuration trade matrices.
# Source: the team's comparison matrices, Matrix_Tables/ (screenshots dated 10 Oct 2026,
# made by teammates), digitised VERBATIM on 13 Oct 2026, the printed totals included,
# so analysis/trades.py can audit them.
# Score convention: 1-5, higher is better. Weights in percent, as printed.
# `category`: the Script 6 sensitivity category each criterion feeds. This is Claude's
# documented mapping, used for the sensitivity-derived re-weighting:
#   completion = anything whose failure loses a mission (reliability, handling,
#                mechanism, staging, build schedule);
#   mass = airframe mass; drag = parasite drag; structure = load capability;
#   clmax, turn = lap performance; e = induced drag.

