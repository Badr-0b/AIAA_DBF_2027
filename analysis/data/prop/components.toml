# ---------------------------------------------------------------------------
# Statements the model relies on.
# ---------------------------------------------------------------------------
[[statement]]
id = "apc-computed"
source = "apc-performance-page"
rows = [
  ["method", "computational method", "text", "The propeller blade loads, and resulting performance data, are generated using a specialized computational method that is based on Vortex theory.", "APC data are COMPUTED"],
]

[[statement]]
id = "apc-rpm-limit-e"
source = "apc-rpm-limits-rev5"
rows = [
  ["rpm_limit_e", "150,000", "rpm*in", "Thin Electric (E) Propellers and Polycarbonate (Durable) FPV Propellers Maximum RPM = 150,000/prop diameter (inches)", "max RPM = 150000 / D(in)"],
]

[[statement]]
id = "uiuc-vol4"
source = "uiuc-propdb-vol4-page"
rows = [
  ["scope", "17 APC Thin Electric", "text", "This webpage includes wind tunnel measurements for 17 APC Thin Electric 2-bladed, fixed propellers with diameters of 12 to 21 in", ""],
  ["diameter_basis", "true diameter", "text", "Coefficients are based on the propeller true diameter", "no geometry published for Vol. 4: basis treated as nominal (see README)"],
]

[[statement]]
id = "uiuc-vol4-method"
source = "uiuc-vol4-paper"
rows = [
  ["rpm_range", "1,000 to 7,000 RPM", "text", "The propellers were tested at rotation rates of 1,000 to 7,000 RPM", ""],
  ["v_range", "8 to 80 ft/s", "text", "advancing flows of 8 to 80 ft/s", "2.4-24.4 m/s"],
  ["calibration", "1% or less", "text", "any change in the slopes were typically 1% or less", "load and torque cell calibration drift"],
  ["vintage", "2019 and 2021", "text", "all of the propellers tested were purchased between 2019 and 2021", ""],
]
