# Design parameters and measured performance of the AIAA DBF top-3 design
# reports (the three highest report scores each year), as published by AIAA.
#
# One [[team]] per report. rows = [param, mission, value, unit, kind, page, quote, where]
#   value  exactly as printed (units converted to SI by verify.py, never here)
#   kind   design | predicted | measured (flight or ground test by the team)
#   page   PDF page of the AIAA compilation (sources.toml id in `source`)
#   quote  verbatim text that verify.py must find in the cached source text
#          (whitespace-normalised). For table cells whose label and value are
#          separated in the text layer, the quote is the run of numbers holding
#          the value and `where` names the row, confirmed on the rendered page.
#   where  table or section, and "(read on page image)" when that was needed
# The reports disagree with themselves in places (several tables per value);
# the weight-and-balance table (weighed components) is preferred for mass, and
# the predicted-vs-measured table for performance. Extracted 12 Oct 2026.
#
# param vocabulary: span, wing_area, aspect_ratio, empty_mass, gross_mass,
#   battery (cells + mAh, Wh derived at 3.7 V/cell), battery_wh, cruise_speed,
#   max_speed, lap_time, first_lap_time, turn360_time, laps, mission_time,
#   load_factor, bank

