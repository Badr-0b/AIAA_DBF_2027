# ---------------------------------------------------------------------------
# Fuse behaviour above the 100 A rating (rules Sec. 3.2.3.2 caps the RATING,
# not the instantaneous current). The fuse the rules link to (Figure 5) is a
# generic, unbranded 100 A MAXI blade fuse with no datasheet, so team tests are
# the evidence. Text only (no values used as limits): Script 3b holds sustained
# current to the 100 A rating.
# ---------------------------------------------------------------------------
[[point]]
id = "erau-fuse-tests"
year = 2025
team = "Embry-Riddle Aeronautical University, Daytona Beach"
source = "aiaa-dbf-2025-reports"
condition = "100 A blade fuses, team bench tests"
use = "fuse: overload margin evidence (not used as a design limit)"
rows = [
  ["fuse_135a", "135 A for at least 60 seconds", "text", 148, "they could sustain a continuous current of 135 A for at least 60 seconds and endure up to 200 A for a maximum of two seconds"],
]

