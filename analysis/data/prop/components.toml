# Propulsion component data for Script 3b: batteries, the motors whose pages are
# not parsed by code, and the method statements the model relies on. Every row
# is checked by verify_prop.py: the quote must be in the cached text of its
# source (analysis/data/raw/prop/<source>.txt, whitespace-normalised) and the
# value must be inside the quote. SI conversion happens in verify_prop.py only.
#
# rows = [param, value, unit, quote, where]
#   value  exactly as printed on the page
#   where  which cell / column, when the quote is a table run
# T-Motor AT motors are NOT typed here: propdata.py parses their spec tables
# and measured test tables straight from the cached pages (tests pin values).
# Read on 14 Oct 2026.

# ---------------------------------------------------------------------------
# Propulsion batteries. Rules Sec. 3.2.3.2: <= 100 Wh rated (capacity x rated
# voltage) and fuse rating <= the pack's maximum continuous current (capacity x
# C, or the labelled maximum), up to 100 A. Masses: Thunder Power labels its
# figures "*estimate only*"; MaxAmps states them flatly.
# ---------------------------------------------------------------------------
