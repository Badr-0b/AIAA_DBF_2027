# Propulsion source registry (Script 3b). Every value in analysis/data/prop/ cites
# one of these ids. fetch_prop.py downloads each url into
# analysis/data/raw/prop/<id>.<ext> (gitignored), records the SHA-256 in
# sources.lock, and writes raw/prop/<id>.txt (the page's visible text, or
# pdftotext -layout) for verify_prop.py to check every quoted value against.
#
# Primary sources only: the publisher of a document is the authority for it.
#   kind      zip | pdf | html | json   (checked by magic bytes or content)
#   referer   sent with the request (APC serves files only to a browser session)
#   nature    what the data is: COMPUTED (a model's output), MEASURED (a test),
#             SPEC (a manufacturer's rating), RULE, STATEMENT
# Read on 14 Oct 2026 unless stated.

# ---------------------------------------------------------------------------
# Propellers. APC publishes computed performance for every propeller it makes;
# the UIUC Propeller Data Site publishes wind-tunnel measurements of a subset.
# ---------------------------------------------------------------------------
