# Aerodynamics source registry (wing CLmax, flaps, drag). Every value in
# analysis/data/aero/ cites one of these ids. fetch_aero.py downloads each url
# into analysis/data/raw/aero/<id>.<ext> (gitignored), records the SHA-256 in
# sources.lock, and writes raw/aero/<id>.txt (pdftotext -layout, or the page's
# visible text) for verify_aero.py to check quoted statements against.
#
# Primary sources only: the publisher of a document is the authority for it.
#   kind      zip | pdf | html
#   nature    MEASURED (a test), STATEMENT (method or conditions), COMPUTED
# Read on 15 Oct 2026 unless stated.

# ---------------------------------------------------------------------------
