# ---------------------------------------------------------------------------
# AUDIT (Claude, 13 Oct 2026). Score changes proposed where verified data, physics
# or the rules contradict the printed score. Each change states its evidence. The
# printed matrices above stay untouched; trades.py reports both.
[[audit]]
matrix = "tail"
criterion = "Line clearance safety"
scores = [4, 5, 4]
reason = """Tow-line hang angle (straight-line equilibrium, rho 1.064, 2.73 m x 2.5 mm line, Cd 1.1,
sensor CdA 0.002-0.005 m2): 61-86 deg below horizontal for a 2-5 kg sensor at 25-42 m/s; 31-38 deg
for 0.5 kg at 42 m/s. From a ventral exit >= 0.5 m ahead of the tail the line passes >= 0.3 m below
the exit at the tail station, so clearance is set by the exit location (SR-10), not the tail type.
T-tail keeps a small edge in turns and gusts. ESTIMATE until Script 5."""

[[audit]]
matrix = "tail"
criterion = "Structural load capacity"
scores = [4, 3, 3]
reason = """A T-tail's fin carries the horizontal-tail loads, which makes it heavier and more
flutter-prone than a conventional tail (Raymer, Aircraft Design, ch. 4 tail arrangements); rules
Sec. 3.2.1 require flutter stiffness. Rating the T-tail 5/5 and the conventional tail 3/5 reverses this."""

[[audit]]
matrix = "wing_position"
criterion = "Cargo bay volume & loading"
scores = [4, 2, 4]
reason = """Low-wing top-3 teams chose low wing FOR payload access: WashU 2022 ('allows for payloads to
be easily installed', p121), UW 2023 ('easy access to the payload', p7), ERAU 2023 and 2025 ('ease of
internal payload integration', 2025 p135). High-wing teams cite bay volume (USC 2024 p4). Both have a
case, so 4 and 4; mid wing's carry-through still cuts the bay."""

[[audit]]
matrix = "wing_position"
criterion = "Aerodynamic roll stability"
scores = [5, 4, 4]
reason = """A high wing adds dihedral effect, but a low wing gets the same from geometric dihedral
(WashU 2022 flew 5 deg); roll stability is a tunable handling quality, not a 3-point gap."""
