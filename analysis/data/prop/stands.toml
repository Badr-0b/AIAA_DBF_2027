# Measured propulsion data from AIAA DBF top-3 design reports: the points Script
# 3b is validated against before any result is used. Quotes are checked by
# verify_prop.py against the cached AIAA text (analysis/data/raw/<source>.txt,
# from fetch.py), with the same whitespace-normalised rule as verify.py. A quote
# starting "IMAGE:" is a table with no text layer, read on the page rendered with
# pdftoppm (as in dbf_aircraft.toml). Extracted 14 Oct 2026.
#
# One [[point]] per test condition. rows = [param, value, unit, page, quote]
#   param  rpm | thrust | current | power_elec | v_air | energy | time | ...
#   value  exactly as printed; unit converted to SI by verify_prop.py
# Each point lists the hardware with its own quotes, and `use` says what the
# point can validate given what the report states (and what it leaves out).

[[point]]
id = "washu22-static"
year = 2022
team = "Washington University in St. Louis"
source = "aiaa-dbf-2022-reports"
condition = "static, maximum throttle (Fig. 8.1 sweeps throttle to 1), indoors"
motor = "SunnySky X7015-30cc 270 kV (ASSUMED: the report names an 'X7025-30cc-270'; SunnySky's 30cc frame is the X7015 and its 270 kV winding is the 7015KV270, see components.toml)"
prop = "apc:24x12E"
battery = "6S LiPo, Turnigy Graphene Panther 3000 mAh 75C (M1/M2) or Nano-Tech 4500 mAh (M3); the report does not say which was on the stand"
use = "prop: thrust at measured RPM. system: the terminal voltage follows from power / current (22.0 V)"
rows = [
  ["rpm", "4953", "rpm", 175, "RPM 4836 4953"],
  ["thrust", "10.05", "kgf", 175, "Thrust [Kgf] 10.821 10.05"],
  ["current", "120.84", "A", 175, "Max Current [A] 112.94 120.84"],
  ["power_elec", "2658.48", "W", 175, "Electrical Power [W] 2258.5 2658.48"],
  ["hardware", "APC 24x12", "text", 159, "The propulsion system consists of a SunnySky X7025-30cc-270 motor spinning an APC 24x12 prop"],
  ["hardware", "3000 mAh 6S 75C", "text", 159, "3000 mAh 6S 75C"],
  ["hardware", "4500 mAh 6s 45/90C", "text", 159, "4500 mAh 6s 45/90C"],
]

