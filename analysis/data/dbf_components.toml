# Component mass breakdowns (weight-and-balance tables) of the AIAA DBF top-3 design
# reports, 2021-2026, for evidence gap E02 (airframe mass). Extracted 16 Oct 2026.
#
# One [[aircraft]] per table. Each row: [label, category, value, quote(, page if not the table's)]
#   label     the team's own row name, as printed
#   category  wing | fuselage | empennage | gear | propulsion | avionics | payload_system |
#             battery | payload | ballast | other   (see `analysis/mass_breakdown.py`)
#   value     as printed, in the table's `unit`
#   quote     the row as it reads in the cached text layer (verify.py's find, whitespace-
#             normalised), or "IMAGE" for tables with no text layer, read on the page
#             rendered at 130 dpi and confirmed by the table's own sum (sum check below)
# total       the table's printed total for `total_label` and what it includes; the
#             checker sums the rows of `total_rows` categories against it (a reading or a
#             team typo shows up as a mismatch, which is reported, never "fixed")
# not_in_total  rows listed outside the printed total (e.g. a per-mission propeller)
# lumped      categories the team merged into another row (e.g. motors inside the wing):
#             those aircraft are excluded from the per-category statistics of that category
# basis       measured (weighed parts), cad (CAD/estimated), mixed, as the report states

